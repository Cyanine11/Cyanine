<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食物卡路里识别系统 — 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #f3eeff 0%, #faf8ff 35%, #ede8ff 70%, #f5f0ff 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #333;
    overflow: hidden;
    position: relative;
  }

  /* 背景装饰圆形 */
  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(140px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  .bg-blob-1 { width: 520px; height: 520px; background: #c4b5fd; top: -180px; left: -120px; }
  .bg-blob-2 { width: 440px; height: 440px; background: #ddd6fe; bottom: -160px; right: -100px; }
  .bg-blob-3 { width: 280px; height: 280px; background: #ede9fe; top: 50%; left: 60%; }

  /* 登录卡片 */
  .login-container {
    width: 420px;
    position: relative;
    z-index: 1;
  }

  .login-card {
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 48px 40px 40px;
    box-shadow: 0 4px 24px rgba(139, 92, 246, 0.10);
    border: 1px solid rgba(139, 92, 246, 0.10);
    animation: cardIn 0.7s ease-out;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-area { text-align: center; margin-bottom: 36px; }

  .logo-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #8b5cf6, #a78bfa);
    border-radius: 14px;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 28px; color: #fff;
    margin-bottom: 16px;
  }

  .logo-title { font-size: 22px; font-weight: 700; color: #3b1f8a; letter-spacing: 0.5px; }
  .logo-subtitle { font-size: 13px; color: #a78bfa; margin-top: 6px; }

  .form-group { margin-bottom: 20px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: #6554a0; margin-bottom: 8px; }

  .input-wrapper input {
    width: 100%; padding: 12px 16px;
    border: 1.5px solid #e4def8;
    border-radius: 10px;
    font-size: 15px; font-family: inherit; color: #333;
    background: #faf8fe; outline: none;
    transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
  }
  .input-wrapper input:focus {
    border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.08);
    background: #fff;
  }
  .input-wrapper input::placeholder { color: #c4b5fd; }

  .btn-login {
    width: 100%; padding: 13px;
    border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600; font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    cursor: pointer;
    transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
    letter-spacing: 1px;
  }
  .btn-login:hover {
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
    box-shadow: 0 4px 16px rgba(139, 92, 246, 0.30);
    transform: scale(1.02);
  }
  .btn-login:active { transform: scale(0.98); }

  .hint-text { text-align: center; font-size: 12px; color: #c4b5fd; margin-top: 20px; }
</style>
</head>
<body>

<div class="bg-blob bg-blob-1"></div>
<div class="bg-blob bg-blob-2"></div>
<div class="bg-blob bg-blob-3"></div>

<div class="login-container">
  <div class="login-card">
    <div class="logo-area">
      <div class="logo-icon">&#127798;</div>
      <div class="logo-title">食物卡路里识别</div>
      <div class="logo-subtitle">Food Calorie Recognition</div>
    </div>

    <div class="form-group">
      <label class="form-label">用户名</label>
      <div class="input-wrapper">
        <input type="text" id="username" placeholder="请输入您的用户名" maxlength="20" autocomplete="off">
      </div>
    </div>

    <button class="btn-login" onclick="doLogin()">进入系统</button>

    <div class="hint-text">只需输入用户名即可使用，无需注册</div>
  </div>
</div>

<script>
  var input = document.getElementById("username");
  (function () {
    var saved = localStorage.getItem("food_calorie_username");
    if (saved) input.value = saved;
  })();
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
  function doLogin() {
    var name = input.value.trim();
    if (!name) { input.focus(); input.style.borderColor = "#e74c3c"; setTimeout(function () { input.style.borderColor = "#e4def8"; }, 1500); return; }
    localStorage.setItem("food_calorie_username", name);
    window.location.href = "/main";
  }
</script>

</body>
</html>
