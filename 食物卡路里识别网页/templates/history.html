<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>检测历史 — 食物卡路里识别</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #f3eeff 0%, #faf8ff 35%, #ede8ff 70%, #f5f0ff 100%);
    color: #333; min-height: 100vh;
    position: relative;
  }

  .bg-blob {
    position: fixed; border-radius: 50%; filter: blur(150px);
    opacity: 0.28; pointer-events: none; z-index: 0;
  }
  .bg-blob-1 { width: 480px; height: 480px; background: #c4b5fd; top: -120px; right: -100px; }
  .bg-blob-2 { width: 380px; height: 380px; background: #ddd6fe; bottom: -120px; left: -80px; }

  /* ===== 导航栏 ===== */
  .navbar {
    background: rgba(255,255,255,0.80); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(139,92,246,0.08);
    padding: 14px 0; position: sticky; top: 0; z-index: 100;
  }
  .navbar-inner {
    width: 720px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo { font-size: 17px; font-weight: 700; color: #3b1f8a; letter-spacing: 0.5px; }
  .nav-right { display: flex; align-items: center; gap: 10px; }

  .btn-sm {
    background: rgba(255,255,255,0.7); border: 1px solid #ddd6fe; color: #7c6faa;
    padding: 5px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: border-color 0.2s, color 0.2s, transform 0.15s;
  }
  .btn-sm:hover { border-color: #8b5cf6; color: #8b5cf6; transform: scale(1.04); }

  /* ===== 主容器 ===== */
  .main-container { width: 720px; margin: 0 auto; position: relative; z-index: 1; }

  .page-title { font-size: 20px; font-weight: 700; color: #3b1f8a; margin: 32px 0 18px; }

  /* ===== 历史列表 ===== */
  .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .history-header .count { font-size: 12px; color: #a78bfa; }

  .btn-clear-all {
    background: none; border: 1px solid #ddd6fe; color: #a78bfa;
    padding: 5px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: border-color 0.2s, color 0.2s;
    display: none;
  }
  .btn-clear-all.show { display: inline-block; }
  .btn-clear-all:hover { border-color: #ef4444; color: #ef4444; }

  .history-list { display: flex; flex-direction: column; gap: 10px; }

  .history-item {
    background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(139,92,246,0.06);
    border-radius: 12px; padding: 14px 16px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 1px 6px rgba(139,92,246,0.03);
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    animation: itemIn 0.4s ease-out backwards;
  }
  .history-item:nth-child(1) { animation-delay: 0s; }
  .history-item:nth-child(2) { animation-delay: 0.06s; }
  .history-item:nth-child(3) { animation-delay: 0.12s; }
  .history-item:nth-child(4) { animation-delay: 0.18s; }
  .history-item:nth-child(5) { animation-delay: 0.24s; }

  @keyframes itemIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .history-item:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(139,92,246,0.10); border-color: #c4b5fd; }

  .history-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex-shrink: 0; border: 1px solid #e4def8; }
  .history-info { flex: 1; min-width: 0; }
  .history-food { font-size: 15px; font-weight: 700; color: #3b1f8a; margin-bottom: 2px; }
  .history-meta { font-size: 12px; color: #a78bfa; }
  .history-meta span { color: #8b5cf6; font-weight: 600; }

  .history-kcal { font-size: 18px; font-weight: 700; color: #8b5cf6; text-align: right; flex-shrink: 0; }
  .history-kcal small { font-size: 12px; font-weight: 400; color: #a78bfa; display: block; }

  .btn-delete {
    background: none; border: none; color: #d4cee8; cursor: pointer;
    font-size: 16px; padding: 4px; line-height: 1; flex-shrink: 0;
    transition: color 0.2s;
  }
  .btn-delete:hover { color: #ef4444; }

  .history-empty { text-align: center; padding: 48px 20px; color: #c4b5fd; font-size: 14px; }
  .history-empty-icon { font-size: 40px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="bg-blob bg-blob-1"></div>
<div class="bg-blob bg-blob-2"></div>

<div class="navbar">
  <div class="navbar-inner">
    <div class="nav-logo">食物卡路里识别</div>
    <div class="nav-right">
      <button class="btn-sm" onclick="window.location.href='/main'">返回主页</button>
    </div>
  </div>
</div>

<div class="main-container">
  <div class="page-title">检测历史</div>

  <div class="history-header">
    <span class="count" id="historyCount">共 0 条记录</span>
    <button class="btn-clear-all" id="btnClearAll" onclick="clearAllHistory()">清空全部</button>
  </div>

  <div class="history-list" id="historyList">
    <div class="history-empty"><div class="history-empty-icon">&#128203;</div>暂无检测记录</div>
  </div>
</div>

<script>
  loadHistory();
  function loadHistory() {
    var records = JSON.parse(localStorage.getItem("food_calorie_history") || "[]");
    var listEl = document.getElementById("historyList");
    var countEl = document.getElementById("historyCount");
    var clearBtn = document.getElementById("btnClearAll");
    countEl.textContent = "共 " + records.length + " 条记录";
    clearBtn.className = records.length > 0 ? "btn-clear-all show" : "btn-clear-all";
    if (records.length === 0) { listEl.innerHTML = '<div class="history-empty"><div class="history-empty-icon">&#128203;</div>暂无检测记录</div>'; return; }
    var html = "";
    records.forEach(function (r) {
      var portionKcal = r.nutrition ? Math.round(r.nutrition.kcal * r.nutrition.portion / 100) : 0;
      html += '<div class="history-item"><img class="history-thumb" src="' + (r.thumb || '') + '" alt=""><div class="history-info"><div class="history-food">' + r.foodName + '</div><div class="history-meta">' + r.time + ' | 置信度 <span>' + r.confidence + '%</span></div></div><div class="history-kcal">' + portionKcal + ' <small>kcal/份</small></div><button class="btn-delete" onclick="deleteRecord(' + r.id + ')" title="删除">&#10005;</button></div>';
    });
    listEl.innerHTML = html;
  }
  function deleteRecord(id) {
    var records = JSON.parse(localStorage.getItem("food_calorie_history") || "[]");
    records = records.filter(function (r) { return r.id !== id; });
    localStorage.setItem("food_calorie_history", JSON.stringify(records)); loadHistory();
  }
  function clearAllHistory() {
    if (!confirm("确定要清空全部历史记录吗？")) return;
    localStorage.removeItem("food_calorie_history"); loadHistory();
  }
</script>

</body>
</html>
